apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: innovatech-backend
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: innovatech-frontend
      ports:
        - protocol: TCP
          port: 5000
  policyTypes:
    - Ingress
