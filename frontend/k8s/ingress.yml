apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # HTTPS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-central-1:846244128735:certificate/c092bbec-342a-4416-84a7-ec68898cbe86"
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    # ALB group
    alb.ingress.kubernetes.io/group.name: innovatech

    # Cognito auth (single-line JSON)
    alb.ingress.kubernetes.io/auth-type: cognito
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    alb.ingress.kubernetes.io/auth-scope: openid
    alb.ingress.kubernetes.io/auth-session-cookie: awsalb-auth
    alb.ingress.kubernetes.io/auth-session-timeout: "604800"
    alb.ingress.kubernetes.io/auth-idp-cognito: "{\"UserPoolArn\":\"arn:aws:cognito-idp:eu-central-1:846244128735:userpool/eu-central-1_M7dv2P69r\",\"UserPoolClientId\":\"2lkt48up7ohdpqcaktu7tjintk\",\"UserPoolDomain\":\"innovatech-b13bd809\"}"

spec:
  rules:
    - host: portal.daanwelten.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
