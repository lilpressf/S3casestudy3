name: Build, Push & Deploy Infrastructure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # Validate branch
      - name: Validate branch
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          echo "Running on branch: $BRANCH_NAME"
          if [ "$BRANCH_NAME" != "test" ]; then
            echo "ERROR: This workflow can only run on the 'test' branch."
            exit 1
          fi

      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # AWS Credentials
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Terraform vars
      - name: Set Terraform env vars
        run: |
          echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_cidr=${{ secrets.SSH_CIDR }}" >> $GITHUB_ENV

      # Terraform setup
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # Terraform Init
      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ./terraform

      # Terraform plan/apply (ECR created here)
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform

      # Capture Terraform outputs for manifests
      - name: Capture Terraform outputs
        run: |
          echo "COGNITO_POOL_ID=$(terraform -chdir=terraform output -raw cognito_user_pool_id)" >> $GITHUB_ENV
          echo "COGNITO_CLIENT_ID=$(terraform -chdir=terraform output -raw cognito_user_pool_client_id)" >> $GITHUB_ENV

      # Docker login AFTER ECR exists
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker
      - name: Build Docker images
        run: |
          cd backend
          docker build -t innovatech-backend .
          cd ../frontend
          docker build -t innovatech-frontend .

      - name: Tag & Push Docker images
        run: |
          ECR="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/innovatech-backend:latest"
          ECR_FE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/innovatech-frontend:latest"
          docker tag innovatech-backend $ECR
          docker push $ECR
          docker tag innovatech-frontend $ECR_FE
          docker push $ECR_FE

      # Install kubectl
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      # Configure kubeconfig
      - name: Generate kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name innovatech-eks

      # Wait for AWS Load Balancer Controller (with diagnostics and hard timeout)
      - name: Ensure AWS Load Balancer Controller Ready
        run: |
          set -euo pipefail
          NAMESPACE=kube-system
          DEPLOYMENT=aws-load-balancer-controller
          TIMEOUT=60s

          echo "Waiting for $DEPLOYMENT (first attempt, timeout $TIMEOUT)"
          if timeout $TIMEOUT kubectl -n $NAMESPACE rollout status deployment/$DEPLOYMENT --timeout=$TIMEOUT; then
            exit 0
          fi

          echo "Controller not ready on first attempt; collecting diagnostics..."
          kubectl -n $NAMESPACE get pods -l app.kubernetes.io/name=$DEPLOYMENT -o wide || true
          kubectl -n $NAMESPACE describe deployment/$DEPLOYMENT || true
          kubectl -n $NAMESPACE get events --sort-by=.lastTimestamp | tail -n 40 || true
          kubectl -n $NAMESPACE logs deployment/$DEPLOYMENT --tail=200 || true

          echo "Restarting deployment and waiting again..."
          kubectl -n $NAMESPACE rollout restart deployment/$DEPLOYMENT
          timeout $TIMEOUT kubectl -n $NAMESPACE rollout status deployment/$DEPLOYMENT --timeout=$TIMEOUT

      # ADD SSO ROLE TO EKS AUTOMATICALLY
      - name: Apply aws-auth mapping for SSO role
        env:
          AWS_SSO_ROLE_ARN: ${{ secrets.AWS_SSO_ROLE_ARN }}
        run: |
          cd backend/k8s
          envsubst < aws-auth-template.yml > aws-auth.yml
          kubectl apply -f aws-auth.yml

      # Prepare temp manifests
      - name: Prepare manifests
        run: |
          mkdir -p k8s-temp/backend k8s-temp/frontend
          cp backend/k8s/*.yml k8s-temp/backend/
          cp frontend/k8s/*.yml k8s-temp/frontend/

          sed -i "s|<AWS_ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<AWS_REGION>|${{ secrets.AWS_REGION }}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<AWS_ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s-temp/backend/serviceaccount.yml
          sed -i "s|<COGNITO_POOL_ID>|${COGNITO_POOL_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<COGNITO_CLIENT_ID>|${COGNITO_CLIENT_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<AWS_ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s-temp/frontend/deployment.yml
          sed -i "s|<AWS_REGION>|${{ secrets.AWS_REGION }}|g" k8s-temp/frontend/deployment.yml

      # Deploy to EKS
      - name: Apply manifests
        run: |
          kubectl apply -f k8s-temp/backend/
          kubectl apply -f k8s-temp/frontend/
