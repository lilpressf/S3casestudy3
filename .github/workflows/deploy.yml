name: Build, Push & Deploy Infrastructure and App

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  infra:
    name: Terraform & Cluster Bootstrap
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      eks_cluster_name: ${{ steps.tf_outputs.outputs.eks_cluster_name }}
      eks_node_role_arn: ${{ steps.tf_outputs.outputs.eks_node_role_arn }}
      eks_node_group_name: ${{ steps.tf_outputs.outputs.eks_node_group_name }}
      cognito_user_pool_id: ${{ steps.tf_outputs.outputs.cognito_user_pool_id }}
      cognito_user_pool_client_id: ${{ steps.tf_outputs.outputs.cognito_user_pool_client_id }}
      cognito_user_pool_domain: ${{ steps.tf_outputs.outputs.cognito_user_pool_domain }}
      acm_certificate_arn: ${{ steps.tf_outputs.outputs.acm_certificate_arn }}

    steps:
      - name: Validate branch
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          if [ "$BRANCH_NAME" != "test" ]; then
            echo "ERROR: Only the 'test' branch can deploy."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set Terraform env vars
        run: |
          echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_cidr=${{ secrets.SSH_CIDR }}" >> $GITHUB_ENV
          echo "TF_VAR_workspaces_directory_id=${{ secrets.WORKSPACES_DIRECTORY_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_workspaces_bundle_id=${{ secrets.WORKSPACES_BUNDLE_ID }}" >> $GITHUB_ENV

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -reconfigure

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Collect Terraform outputs
        id: tf_outputs
        working-directory: ./terraform
        run: |
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "eks_node_role_arn=$(terraform output -raw eks_node_role_arn)" >> $GITHUB_OUTPUT
          echo "eks_node_group_name=$(terraform output -raw eks_node_group_name)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_client_id=$(terraform output -raw cognito_user_pool_client_id)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_domain=$(terraform output -raw cognito_user_pool_domain)" >> $GITHUB_OUTPUT
          echo "acm_certificate_arn=$(terraform output -raw acm_certificate_arn)" >> $GITHUB_OUTPUT

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ steps.tf_outputs.outputs.eks_cluster_name }}"

      - name: Apply aws-auth ConfigMap (Nodes + optional SSO)
        env:
          AWS_SSO_ROLE_ARN: ${{ secrets.AWS_SSO_ROLE_ARN }}
          EKS_NODE_ROLE_ARN: ${{ steps.tf_outputs.outputs.eks_node_role_arn }}
        run: |
          cd backend/k8s
          envsubst < aws-auth-template.yml > aws-auth.yml
          kubectl apply -f aws-auth.yml

      - name: Wait for worker nodes Ready
        run: |
          kubectl wait --for=condition=Ready node --all --timeout=600s

      - name: Wait for AWS Load Balancer Controller
        run: |
          kubectl -n kube-system rollout status deployment/aws-load-balancer-controller --timeout=600s


  build_and_push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: infra
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend
        run: |
          cd backend
          docker build -t innovatech-backend .

      - name: Build frontend
        run: |
          cd frontend
          docker build -t innovatech-frontend .

      - name: Push Images
        run: |
          docker tag innovatech-backend "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/innovatech-backend:latest"
          docker tag innovatech-frontend "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/innovatech-frontend:latest"

          docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/innovatech-backend:latest"
          docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/innovatech-frontend:latest"


  deploy_app:
    name: Deploy App & Auto-Update DNS
    runs-on: ubuntu-latest
    needs: [infra, build_and_push]
    permissions:
      id-token: write
      contents: read

    env:
      EKS_CLUSTER_NAME: ${{ needs.infra.outputs.eks_cluster_name }}
      COGNITO_POOL_ID: ${{ needs.infra.outputs.cognito_user_pool_id }}
      COGNITO_CLIENT_ID: ${{ needs.infra.outputs.cognito_user_pool_client_id }}
      COGNITO_POOL_DOMAIN: ${{ needs.infra.outputs.cognito_user_pool_domain }}
      ACM_CERT_ARN: ${{ needs.infra.outputs.acm_certificate_arn }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
           VER=$(curl -L -s https://dl.k8s.io/release/stable.txt)
           curl -LO "https://dl.k8s.io/release/${VER}/bin/linux/amd64/kubectl"
           sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Template manifests
        run: |
          mkdir -p k8s-temp/backend k8s-temp/frontend
          cp backend/k8s/*.yml k8s-temp/backend/
          cp frontend/k8s/*.yml k8s-temp/frontend/

          #
          # FRONTEND Ingress
          #
          sed -i "s|<AWS_REGION>|${AWS_REGION}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<AWS_ACCOUNT_ID>|${AWS_ACCOUNT_ID}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<COGNITO_POOL_ID>|${COGNITO_POOL_ID}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<COGNITO_CLIENT_ID>|${COGNITO_CLIENT_ID}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<COGNITO_POOL_DOMAIN>|${COGNITO_POOL_DOMAIN}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<ACM_CERT_ARN>|${ACM_CERT_ARN}|g" k8s-temp/frontend/ingress.yml

          #
          # BACKEND Deployment + Ingress
          #
          # Deployment ENV FIXES (these were missing)
          sed -i "s|<AWS_REGION>|${AWS_REGION}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<AWS_ACCOUNT_ID>|${AWS_ACCOUNT_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<COGNITO_POOL_ID>|${COGNITO_POOL_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<COGNITO_CLIENT_ID>|${COGNITO_CLIENT_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<WORKSPACES_DIRECTORY_ID>|${WORKSPACES_DIRECTORY_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<WORKSPACES_BUNDLE_ID>|${WORKSPACES_BUNDLE_ID}|g" k8s-temp/backend/backend-deployment.yml

          # Backend Ingress fixes
          sed -i "s|<AWS_REGION>|${AWS_REGION}|g" k8s-temp/backend/backend-ingress.yml
          sed -i "s|<AWS_ACCOUNT_ID>|${AWS_ACCOUNT_ID}|g" k8s-temp/backend/backend-ingress.yml
          sed -i "s|<COGNITO_POOL_ID>|${COGNITO_POOL_ID}|g" k8s-temp/backend/backend-ingress.yml
          sed -i "s|<COGNITO_CLIENT_ID>|${COGNITO_CLIENT_ID}|g" k8s-temp/backend/backend-ingress.yml
          sed -i "s|<COGNITO_POOL_DOMAIN>|${COGNITO_POOL_DOMAIN}|g" k8s-temp/backend/backend-ingress.yml
          sed -i "s|<ACM_CERT_ARN>|${ACM_CERT_ARN}|g" k8s-temp/backend/backend-ingress.yml

      - name: Apply backend
        run: kubectl apply -f k8s-temp/backend/

      - name: Apply frontend
        run: kubectl apply -f k8s-temp/frontend/

      - name: Wait for Deployments Ready
        run: |
          kubectl rollout status deployment/innovatech-backend --timeout=600s
          kubectl rollout status deployment/innovatech-frontend --timeout=600s

      - name: Capture ALB Hostname
        id: alb
        run: |
          for i in {1..30}; do
            HOST=$(kubectl get ingress frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$HOST" ]; then
              echo "ALB_HOST=$HOST" >> $GITHUB_ENV
              exit 0
            fi
            echo "Waiting for ALB hostname... ($i/30)"
            sleep 10
          done
          echo "ERROR: Could not find ALB hostname"
          exit 1

      - name: Update Route53 DNS via Terraform
        run: |
          echo "alb_dns_name = \"${ALB_HOST}\"" > terraform/alb.auto.tfvars
          terraform -chdir=terraform apply -auto-approve

      - name: Smoke test backend inside cluster
        run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=curlimages/curl -- \
            curl -sSf http://backend:5000/api/health
