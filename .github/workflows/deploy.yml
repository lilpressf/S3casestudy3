name: Build, Push & Deploy Infrastructure and App

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:

  infra:
    name: Terraform & Cluster Bootstrap
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      eks_cluster_name: ${{ steps.tf.outputs.eks_cluster_name }}
      eks_node_role_arn: ${{ steps.tf.outputs.eks_node_role_arn }}
      eks_node_group_name: ${{ steps.tf.outputs.eks_node_group_name }}
      cognito_user_pool_id: ${{ steps.tf.outputs.cognito_user_pool_id }}
      cognito_user_pool_client_id: ${{ steps.tf.outputs.cognito_user_pool_client_id }}
      cognito_user_pool_client_secret: ${{ steps.tf.outputs.cognito_user_pool_client_secret }}
      cognito_user_pool_domain: ${{ steps.tf.outputs.cognito_user_pool_domain }}
      cognito_user_pool_arn: ${{ steps.tf.outputs.cognito_user_pool_arn }}
      acm_certificate_arn: ${{ steps.tf.outputs.acm_certificate_arn }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Collect Outputs
        id: tf
        working-directory: terraform
        run: |
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "eks_node_role_arn=$(terraform output -raw eks_node_role_arn)" >> $GITHUB_OUTPUT
          echo "eks_node_group_name=$(terraform output -raw eks_node_group_name)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_client_id=$(terraform output -raw cognito_user_pool_client_id)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_client_secret=$(terraform output -raw cognito_user_pool_client_secret)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_domain=$(terraform output -raw cognito_user_pool_domain)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_arn=$(terraform output -raw cognito_user_pool_arn)" >> $GITHUB_OUTPUT
          echo "acm_certificate_arn=$(terraform output -raw acm_certificate_arn)" >> $GITHUB_OUTPUT

  build_and_push:
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build Images
        run: |
          docker build -t innovatech-backend ./backend
          docker build -t innovatech-frontend ./frontend

      - name: Push Images
        run: |
          docker tag innovatech-backend $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/innovatech-backend:latest
          docker tag innovatech-frontend $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/innovatech-frontend:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/innovatech-backend:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/innovatech-frontend:latest

  deploy_app:
    runs-on: ubuntu-latest
    needs: [infra, build_and_push]

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      EKS_CLUSTER_NAME: ${{ needs.infra.outputs.eks_cluster_name }}
      COGNITO_POOL_ARN: ${{ needs.infra.outputs.cognito_user_pool_arn }}
      COGNITO_CLIENT_ID: ${{ needs.infra.outputs.cognito_user_pool_client_id }}
      COGNITO_CLIENT_SECRET: ${{ needs.infra.outputs.cognito_user_pool_client_secret }}
      COGNITO_POOL_DOMAIN: ${{ needs.infra.outputs.cognito_user_pool_domain }}
      ACM_CERT_ARN: ${{ needs.infra.outputs.acm_certificate_arn }}

    steps:

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          VER=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          curl -LO "https://dl.k8s.io/release/${VER}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            --force

      - name: Delete Old Ingresses (avoid stuck finalizers)
        run: |
          kubectl delete ingress frontend --ignore-not-found
          kubectl delete ingress backend --ignore-not-found

      - name: Template manifests
        run: |
          mkdir -p k8s-temp/backend k8s-temp/frontend

          cp backend/k8s/*.yml k8s-temp/backend/
          cp frontend/k8s/*.yml k8s-temp/frontend/

          sed -i "s|<COGNITO_POOL_ARN>|${COGNITO_POOL_ARN}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<COGNITO_CLIENT_ID>|${COGNITO_CLIENT_ID}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<COGNITO_CLIENT_SECRET>|${COGNITO_CLIENT_SECRET}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<COGNITO_POOL_DOMAIN>|${COGNITO_POOL_DOMAIN}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<ACM_CERT_ARN>|${ACM_CERT_ARN}|g" k8s-temp/frontend/ingress.yml

      - name: Apply Manifests
        run: |
          kubectl apply -f k8s-temp/backend/
          kubectl apply -f k8s-temp/frontend/

      - name: Wait for ALB hostname
        id: alb
        run: |
          for i in {1..40}; do
            H=$(kubectl get ingress frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$H" ]; then
              echo "ALB_HOST=$H" >> $GITHUB_ENV
              exit 0
            fi
            echo "Waiting for ALB... ($i/40)"
            sleep 10
          done
          echo "ERROR: ALB hostname not found"
          exit 1
