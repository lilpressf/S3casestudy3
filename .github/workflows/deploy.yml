name: Build, Push & Deploy Infrastructure and App

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  

jobs:
  # 1) TERRAFORM: EKS, Cognito, ACM, etc.
  infra:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      eks_cluster_name:            ${{ steps.tf_out.outputs.eks_cluster_name }}
      eks_node_role_arn:           ${{ steps.tf_out.outputs.eks_node_role_arn }}
      eks_node_group_name:         ${{ steps.tf_out.outputs.eks_node_group_name }}
      cognito_user_pool_id:        ${{ steps.tf_out.outputs.cognito_user_pool_id }}
      cognito_user_pool_client_id: ${{ steps.tf_out.outputs.cognito_user_pool_client_id }}
      cognito_user_pool_client_secret: ${{ steps.tf_out.outputs.cognito_user_pool_client_secret }}
      cognito_user_pool_domain:    ${{ steps.tf_out.outputs.cognito_user_pool_domain }}
      cognito_user_pool_arn:       ${{ steps.tf_out.outputs.cognito_user_pool_arn }}
      acm_certificate_arn:         ${{ steps.tf_out.outputs.acm_certificate_arn }}
      workstation_launch_template_id: ${{ steps.tf_out.outputs.workstation_launch_template_id }}
      workstation_subnet_id:       ${{ steps.tf_out.outputs.workstation_subnet_id }}
      directory_id:                ${{ steps.tf_out.outputs.directory_id }}
      directory_name:              ${{ steps.tf_out.outputs.directory_name }}
      directory_admin_instance_id: ${{ steps.tf_out.outputs.directory_admin_instance_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Export Terraform vars
        run: |
          echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_cidr=${{ secrets.SSH_CIDR }}" >> $GITHUB_ENV
          echo "TF_VAR_directory_admin_password=${{ secrets.DIRECTORY_ADMIN_PASSWORD }}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Collect Terraform outputs
        id: tf_out
        working-directory: terraform
        run: |
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "eks_node_role_arn=$(terraform output -raw eks_node_role_arn)" >> $GITHUB_OUTPUT
          echo "eks_node_group_name=$(terraform output -raw eks_node_group_name)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_client_id=$(terraform output -raw cognito_user_pool_client_id)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_client_secret=$(terraform output -raw cognito_user_pool_client_secret)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_domain=$(terraform output -raw cognito_user_pool_domain)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_arn=$(terraform output -raw cognito_user_pool_arn)" >> $GITHUB_OUTPUT
          echo "acm_certificate_arn=$(terraform output -raw acm_certificate_arn)" >> $GITHUB_OUTPUT
          echo "workstation_launch_template_id=$(terraform output -raw workstation_launch_template_id)" >> $GITHUB_OUTPUT
          echo "workstation_subnet_id=$(terraform output -raw workstation_subnet_id)" >> $GITHUB_OUTPUT
          echo "directory_id=$(terraform output -raw directory_id)" >> $GITHUB_OUTPUT
          echo "directory_name=$(terraform output -raw directory_name)" >> $GITHUB_OUTPUT
          echo "directory_admin_instance_id=$(terraform output -raw directory_admin_instance_id)" >> $GITHUB_OUTPUT

      - name: Install kubectl
        run: |
          ver=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -LO https://dl.k8s.io/release/$ver/bin/linux/amd64/kubectl
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.tf_out.outputs.eks_cluster_name }}"

      - name: Apply aws-auth ConfigMap
        env:
          EKS_NODE_ROLE_ARN: ${{ steps.tf_out.outputs.eks_node_role_arn }}
        run: |
          cd backend/k8s
          envsubst < aws-auth-template.yml > aws-auth.yml
          kubectl apply -f aws-auth.yml

      - name: Wait for worker nodes Ready
        run: kubectl wait --for=condition=Ready node --all --timeout=600s

      - name: Wait for AWS Load Balancer Controller
        run: kubectl -n kube-system rollout status deployment/aws-load-balancer-controller --timeout=600s


  # 2) BUILD & PUSH DOCKER IMAGES
  build_and_push:
    runs-on: ubuntu-latest
    needs: infra
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker images
        run: |
          docker build -t innovatech-backend ./backend
          docker build -t innovatech-frontend ./frontend

      - name: Push Docker images
        run: |
          docker tag innovatech-backend ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/innovatech-backend:latest
          docker tag innovatech-frontend ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/innovatech-frontend:latest
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/innovatech-backend:latest
          docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/innovatech-frontend:latest


  # 3) DEPLOY TO EKS + ALB + ROUTE53
  deploy_app:
    runs-on: ubuntu-latest
    needs: [infra, build_and_push]
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      EKS_CLUSTER_NAME: ${{ needs.infra.outputs.eks_cluster_name }}
      # Backend & Ingress use these; source from secrets for consistency
      COGNITO_POOL_ID: ${{ secrets.COGNITO_POOL_ID }}
      # Ingress uses these values, sourced from GitHub secrets to avoid Terraform/sensitive-output quirks
      COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
      COGNITO_POOL_DOMAIN: ${{ secrets.COGNITO_POOL_DOMAIN }}
      COGNITO_POOL_ARN: ${{ secrets.COGNITO_POOL_ARN }}
      ACM_CERT_ARN: ${{ secrets.ACM_CERT_ARN }}
      WORKSTATION_LT_ID: ${{ needs.infra.outputs.workstation_launch_template_id }}
      WORKSTATION_SUBNET_ID: ${{ needs.infra.outputs.workstation_subnet_id }}
      DIRECTORY_ID: ${{ needs.infra.outputs.directory_id }}
      DIRECTORY_NAME: ${{ needs.infra.outputs.directory_name }}
      DIRECTORY_ADMIN_INSTANCE_ID: ${{ needs.infra.outputs.directory_admin_instance_id }}
      DIRECTORY_ADMIN_PASSWORD: ${{ secrets.DIRECTORY_ADMIN_PASSWORD }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          ver=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -LO https://dl.k8s.io/release/$ver/bin/linux/amd64/kubectl
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Delete old ingresses (avoid stuck finalizers)
        run: |
          kubectl delete ingress frontend --ignore-not-found
          kubectl delete ingress backend --ignore-not-found

      - name: Template Kubernetes manifests
        run: |
          mkdir -p k8s-temp/backend k8s-temp/frontend

          cp backend/k8s/*.yml k8s-temp/backend/
          cp frontend/k8s/*.yml k8s-temp/frontend/

          # FRONTEND deployment image templating
          sed -i "s|<AWS_REGION>|${AWS_REGION}|g" k8s-temp/frontend/deployment.yml
          sed -i "s|<AWS_ACCOUNT_ID>|${AWS_ACCOUNT_ID}|g" k8s-temp/frontend/deployment.yml

          # FRONTEND ingress templating (Cognito + ACM)
          sed -i "s|<COGNITO_POOL_ARN>|${COGNITO_POOL_ARN}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<COGNITO_CLIENT_ID>|${COGNITO_CLIENT_ID}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<COGNITO_POOL_DOMAIN>|${COGNITO_POOL_DOMAIN}|g" k8s-temp/frontend/ingress.yml
          sed -i "s|<ACM_CERT_ARN>|${ACM_CERT_ARN}|g" k8s-temp/frontend/ingress.yml

          echo "==== Templated frontend Ingress ===="
          cat k8s-temp/frontend/ingress.yml

          # BACKEND deployment templating
          sed -i "s|<AWS_REGION>|${AWS_REGION}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<AWS_ACCOUNT_ID>|${AWS_ACCOUNT_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<COGNITO_POOL_ID>|${COGNITO_POOL_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<COGNITO_CLIENT_ID>|${COGNITO_CLIENT_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<WORKSTATION_LT_ID>|${WORKSTATION_LT_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<WORKSTATION_SUBNET_ID>|${WORKSTATION_SUBNET_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<DIRECTORY_ID>|${DIRECTORY_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<DIRECTORY_NAME>|${DIRECTORY_NAME}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<DIRECTORY_ADMIN_INSTANCE_ID>|${DIRECTORY_ADMIN_INSTANCE_ID}|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|<DIRECTORY_ADMIN_PASSWORD>|${DIRECTORY_ADMIN_PASSWORD}|g" k8s-temp/backend/backend-deployment.yml

          # backend serviceAccount IRSA role
          sed -i "s|<AWS_ACCOUNT_ID>|${AWS_ACCOUNT_ID}|g" k8s-temp/backend/serviceaccount.yml

          # rollout triggers
          sed -i "s|rollme: \"DUMMY\"|rollme: \"${IMAGE_TAG}\"|g" k8s-temp/backend/backend-deployment.yml
          sed -i "s|rollme: \"DUMMY\"|rollme: \"${IMAGE_TAG}\"|g" k8s-temp/frontend/deployment.yml

      - name: Apply manifests
        run: |
          kubectl apply -f k8s-temp/backend/
          kubectl apply -f k8s-temp/frontend/

      - name: Wait for Deployments Ready
        run: |
          kubectl rollout status deployment/innovatech-backend --timeout=600s
          kubectl rollout status deployment/innovatech-frontend --timeout=600s

      - name: Wait for ALB hostname
        id: alb
        run: |
          for i in {1..40}; do
            H=$(kubectl get ingress frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$H" ]; then
              echo "ALB_HOST=$H"
              echo "ALB_HOST=$H" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Waiting for ALB... ($i/40)"
            sleep 10
          done
          echo "ERROR: ALB hostname not found"
          exit 1

      - name: Setup Terraform for DNS
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Update Route53 DNS via Terraform
        run: |
          echo "alb_dns_name = \"${ALB_HOST}\"" > terraform/alb.auto.tfvars
          terraform -chdir=terraform init -reconfigure
          terraform -chdir=terraform apply -auto-approve
