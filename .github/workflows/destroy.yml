name: Destroy AWS Infrastructure

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set Terraform environment variables
        run: |
          echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_cidr=${{ secrets.SSH_CIDR }}" >> $GITHUB_ENV

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ./terraform

      - name: Delete EKS Nodegroups (if any)
        run: |
          echo "Checking for existing EKS nodegroups..."
          CLUSTER="innovatech-eks"
          REGION="${{ secrets.AWS_REGION }}"

          NGS=$(aws eks list-nodegroups \
            --cluster-name $CLUSTER \
            --region $REGION \
            --query 'nodegroups' \
            --output text || true)

          if [ -n "$NGS" ] && [ "$NGS" != "None" ]; then
            echo "Nodegroups found: $NGS"
            for NG in $NGS; do
              echo "Deleting nodegroup: $NG"
              aws eks delete-nodegroup \
                --cluster-name $CLUSTER \
                --nodegroup-name $NG \
                --region $REGION || true

              echo "Waiting for nodegroup deletion: $NG"
              aws eks wait nodegroup-deleted \
                --cluster-name $CLUSTER \
                --nodegroup-name $NG \
                --region $REGION || true
            done
          else
            echo "No nodegroups found."
          fi

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        working-directory: ./terraform
